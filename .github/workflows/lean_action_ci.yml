name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["README.md", "LICENSE-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # During the docs build `lake` reserves far more virtual memory than it uses (up to 111 GB
      # reserved against about 1 GB resident, observed). Under the default heuristic overcommit
      # mode the kernel then refuses to create the `git` processes for the source links, failing
      # with ENOMEM ("resource exhausted (error code: 12)") although real memory use stays around
      # 3 GB.
      - name: Allow memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: docbuild
          use-mathlib-cache: "true"
          build: "true"
          build-args: "Wychelean:docs"
          test: "false"
