name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["README.md", "LICENSE-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: docbuild
          use-mathlib-cache: "true"
          build: "true"
          build-args: "Wychelean:docs"
          test: "false"
