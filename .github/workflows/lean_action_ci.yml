name: Lean Action CI

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["README.md", "LICENSE-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
          test: "true"

  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # doc-gen4 runs one process per module, each loading that module's imports (much of
      # Mathlib), so peak memory can exceed the runner's 16 GB. Without swap, spawning `git` for
      # the source links then fails with ENOMEM ("resource exhausted (error code: 12)").
      - name: Add swap
        run: |
          free -h
          df -h /
          sudo fallocate -l 8G /docs-swapfile
          sudo chmod 600 /docs-swapfile
          sudo mkswap /docs-swapfile
          sudo swapon /docs-swapfile
          free -h

      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: docbuild
          use-mathlib-cache: "true"
          build: "true"
          build-args: "Wychelean:docs"
          test: "false"
